<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music-DL</title>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/plugins/regions.min.js"></script>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --text: #e0e0e0;
            --error: #cf6679;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }
        .container {
            width: 100%;
            max-width: 800px;
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        h1 { text-align: center; color: var(--primary); margin-top: 0; }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input, select {
            background: #2c2c2c;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }
        input[type="text"] { flex-grow: 1; }
        button {
            background: var(--primary);
            color: black;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        button:hover:not(:disabled) { opacity: 0.9; }

        #result { display: none; flex-direction: column; gap: 20px; margin-top: 20px; }
        .info-card { display: flex; gap: 20px; }
        .info-card img { width: 180px; border-radius: 8px; object-fit: cover; }
        .info-text { display: flex; flex-direction: column; justify-content: center; }
        .info-text h3 { margin: 0; }
        .info-text p { margin: 5px 0; opacity: 0.8; }

        #waveform { cursor: pointer; width: 100%; height: 128px; background: #111; border-radius: 8px; margin: 10px 0; position: relative; }
        .waveform-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            z-index: 10;
            pointer-events: none;
            color: var(--secondary);
            font-weight: bold;
            font-size: 0.9rem;
        }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .field { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 0.9rem; color: var(--primary); }

        #progress-container { display: none; margin-top: 20px; }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #333;
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }
        #progress-fill { width: 0%; height: 100%; background: var(--secondary); transition: width 0.3s; }
        .status-info { display: flex; justify-content: space-between; font-size: 0.8rem; opacity: 0.7; }

        .hidden { display: none; }
        
        /* Tabs */
        .tabs {
            display: flex;
            width: 100%;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            color: var(--text);
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 8px 8px 0 0;
            opacity: 0.6;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            opacity: 1;
            color: var(--primary);
            border-bottom: 3px solid var(--primary);
        }
        
        /* Batch UI */
        #batch-urls {
            width: 100%;
            box-sizing: border-box;
            background: #2c2c2c;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 6px;
            outline: none;
            resize: vertical;
            min-height: 120px;
            margin-bottom: 15px;
            font-family: monospace;
        }
        .batch-card {
            background: #252525;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .batch-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .batch-card-title {
            font-weight: bold;
            font-size: 1rem;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-right: 10px;
        }
        .batch-card-status {
            font-size: 0.8rem;
            color: var(--secondary);
            font-weight: bold;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        .batch-card-error {
            color: var(--error);
            font-size: 0.85rem;
            margin: 0;
        }
        .batch-download-btn {
            background: var(--secondary);
            color: black;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            display: inline-block;
        }
        .batch-download-btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Music Downloader</h1>

        <div class="tabs">
            <button class="tab-btn active" id="tab-single">Single Track</button>
            <button class="tab-btn" id="tab-batch">Batch Download</button>
        </div>

        <p id="loading-text" style="display: none; text-align: center; color: var(--secondary); font-weight: bold;">Fetching information, please wait...</p>
        <div id="single-view">
            <div class="input-group">
            <input type="text" id="url" placeholder="Paste YouTube URL here...">
            <button id="fetch-btn">Fetch Info</button>
        </div>

        <div id="result">
            <div class="info-card">
                <img id="thumb" src="" alt="thumbnail">
                <div class="info-text">
                    <h3 id="title-display"></h3>
                    <p id="uploader-display"></p>
                    <p id="duration-display"></p>
                </div>
            </div>

            <div style="position: relative;">
                <div id="waveform"></div>
                <div id="waveform-overlay" class="waveform-overlay">⬇ Download preview first to enable trimming</div>
            </div>
            <div style="display: flex; justify-content: center; align-items: center; gap: 15px; margin-top: 5px;">
                <button id="play-trim-btn" style="padding: 5px 10px; font-size: 0.8rem; background: var(--secondary); color: black; display: none;">▶ Play Trim</button>
                <p id="trim-display" style="font-size: 0.9rem; margin: 0; font-weight: bold; color: var(--secondary);">0:00 → 0:00</p>
            </div>
            <p style="text-align: center; font-size: 0.8rem; margin: 5px 0 0 0; opacity: 0.6;">Click inside region to play • Drag edges to trim</p>

            <div class="controls">
                <div class="field">
                    <label>Format</label>
                    <select id="format-select">
                        <option value="MP3">MP3</option>
                        <option value="M4A">M4A</option>
                        <option value="WEBM">WEBM</option>
                        <option value="FLAC">FLAC</option>
                        <option value="OPUS">OPUS</option>
                    </select>
                </div>
                <div class="field">
                    <label>Quality</label>
                    <select id="quality-select">
                        <option value="Best">Best</option>
                        <option value="High">High (192kbps)</option>
                        <option value="Medium">Medium (128kbps)</option>
                        <option value="Low">Low (64kbps)</option>
                    </select>
                </div>
            </div>

            <div style="margin-top: 10px;">
                <button id="toggle-meta" style="background: none; color: var(--secondary); padding: 0; font-size: 0.9rem; text-decoration: underline;">✎ Edit Metadata</button>
                <div id="meta-section" style="display: none; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px;">
                    <div class="controls">
                        <div class="field">
                            <label>Title</label>
                            <input type="text" id="meta-title">
                        </div>
                        <div class="field">
                            <label>Artist</label>
                            <input type="text" id="meta-artist">
                        </div>
                        <div class="field">
                            <label>Album</label>
                            <input type="text" id="meta-album">
                        </div>
                    </div>
                </div>
            </div>

            <button id="download-btn" style="width: 100%; margin-top: 10px;">Download Preview</button>
            <button id="save-btn" style="width: 100%; margin-top: 10px; display: none; background: #03dac6; color: black;">Save File</button>
        </div>

        <div id="progress-container">
            <p id="status-text" style="text-align: center; margin-bottom: 5px;"></p>
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <div class="status-info">
                <span id="speed-text"></span>
                <span id="eta-text"></span>
            </div>
            </div>
        </div>

        <div id="batch-view" class="hidden">
            <textarea id="batch-urls" placeholder="Paste YouTube URLs here (one per line)"></textarea>
            
            <div class="controls">
                <div class="field">
                    <label>Format</label>
                    <select id="batch-format-select">
                        <option value="MP3" selected>MP3</option>
                        <option value="M4A">M4A</option>
                        <option value="WEBM">WEBM</option>
                        <option value="FLAC">FLAC</option>
                        <option value="OPUS">OPUS</option>
                    </select>
                </div>
                <div class="field">
                    <label>Quality</label>
                    <select id="batch-quality-select">
                        <option value="Best" selected>Best</option>
                        <option value="High">High (192kbps)</option>
                        <option value="Medium">Medium (128kbps)</option>
                        <option value="Low">Low (64kbps)</option>
                    </select>
                </div>
            </div>
            
            <button id="batch-start-btn" style="width: 100%; margin-top: 15px;">Start Batch Download</button>
            
            <div id="batch-results" style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;"></div>
        </div>
    </div>

    <script>
        let wavesurfer, regions;
        let activeRegion;
        let currentInfo;
        let addr = 'https://url-music-dl.loca.lt';

        const fetchBtn = document.getElementById('fetch-btn');
        const downloadBtn = document.getElementById('download-btn');
        const saveBtn = document.getElementById('save-btn');
        const urlInput = document.getElementById('url');
        const resultDiv = document.getElementById('result');
        const progressContainer = document.getElementById('progress-container');
        const playBtn = document.getElementById('play-trim-btn');

        // Metadata toggle
        document.getElementById('toggle-meta').onclick = () => {
            const section = document.getElementById('meta-section');
            section.style.display = section.style.display === 'none' ? 'block' : 'none';
        };

        const loadingText = document.getElementById('loading-text');

        fetchBtn.onclick = async () => {
            const url = urlInput.value.trim();
            if (!url) return;

            fetchBtn.disabled = true;
            fetchBtn.textContent = 'Fetching...';
            resultDiv.style.display = 'none';
            progressContainer.style.display = 'none';
            loadingText.style.display = 'block'; // Show loading text
            downloadBtn.style.display = 'block';
            saveBtn.style.display = 'none';
            playBtn.style.display = 'none';

            try {
                const res = await fetch(`${addr}/api/info`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Bypass-Tunnel-Reminder': 'true' },
                    body: JSON.stringify({ url })
                });
                const data = await res.json();
                if (res.status !== 200) throw new Error(data.detail);

                currentInfo = data;
                displayInfo(data);
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                fetchBtn.disabled = false;
                fetchBtn.textContent = 'Fetch Info';
                loadingText.style.display = 'none'; // Hide loading text
            }
        };

        function displayInfo(data) {
            // Handle potentially missing thumbnails from playlists
            const thumbImg = document.getElementById('thumb');
            if (data.thumbnail) {
                thumbImg.src = data.thumbnail;
                thumbImg.style.display = 'block';
            } else {
                thumbImg.style.display = 'none';
            }

            document.getElementById('title-display').textContent = data.title;
            document.getElementById('uploader-display').textContent = data.uploader;

            const metaToggle = document.getElementById('toggle-meta');
            const metaSection = document.getElementById('meta-section');
            const waveformContainer = document.getElementById('waveform').parentElement;
            const trimDisplayContainer = document.getElementById('trim-display').parentElement;
            const trimHint = document.querySelector('p[style*="Click inside region"]');

            if (data.is_playlist) {
                document.getElementById('duration-display').textContent = `${data.track_count} Tracks`;

                // Completely hide trimming and metadata UI for playlists
                waveformContainer.style.display = 'none';
                metaToggle.style.display = 'none';
                metaSection.style.display = 'none';
                trimDisplayContainer.style.display = 'none';
                if(trimHint) trimHint.style.display = 'none';

                downloadBtn.textContent = 'Download Playlist as ZIP';
            } else {
                document.getElementById('duration-display').textContent = formatDuration(data.duration);

                // Restore UI for single tracks
                waveformContainer.style.display = 'block';
                metaToggle.style.display = 'block';
                trimDisplayContainer.style.display = 'flex';
                if(trimHint) trimHint.style.display = 'block';
                downloadBtn.textContent = 'Download Preview';

                document.getElementById('meta-title').value = data.title;
                document.getElementById('meta-artist').value = data.uploader;
                document.getElementById('meta-album').value = '';

                initWaveform(data.duration);
            }

            resultDiv.style.display = 'flex';
        }


        function formatDuration(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function initWaveform(duration, audioUrl = null) {
            if (wavesurfer) wavesurfer.destroy();
            activeRegion = null;

            const overlay = document.getElementById('waveform-overlay');
            if (audioUrl) {
                overlay.style.display = 'none';
                playBtn.style.display = 'block';
            } else {
                overlay.style.display = 'flex';
                playBtn.style.display = 'none';
            }

            regions = WaveSurfer.Regions.create();

            wavesurfer = WaveSurfer.create({
                container: '#waveform',
                waveColor: audioUrl ? '#666' : '#444',
                progressColor: audioUrl ? '#666' : '#444',
                cursorColor: audioUrl ? '#03dac6' : 'transparent',
                cursorWidth: audioUrl ? 2 : 0,
                height: 128,
                plugins: [regions],
                interact: !!audioUrl,
            });

            if (audioUrl) {
                wavesurfer.load(audioUrl);
            } else {
                const peaks = [];
                for (let i = 0; i < 200; i++) peaks.push(Math.random() * 0.8 + 0.1);
                wavesurfer.load('', [peaks], duration);
            }

            wavesurfer.on('loading', (percent) => {
                const overlay = document.getElementById('waveform-overlay');
                overlay.style.display = 'flex';
                overlay.textContent = `Loading waveform: ${percent}%`;
            });

            // Clears the overlay when ready
            wavesurfer.on('ready', () => {
                const overlay = document.getElementById('waveform-overlay');
                overlay.style.display = 'none';

                activeRegion = regions.addRegion({
                    id: 'trim',
                    start: 0,
                    end: duration,
                    color: 'rgba(100, 200, 255, 0.12)',
                    drag: !!audioUrl,
                    resize: !!audioUrl,
                });
                updateTrimDisplay(0, duration);
            });

            wavesurfer.on('interaction', (newTime) => {
                if (!audioUrl) return;
                if (activeRegion) {
                    const clamped = Math.max(activeRegion.start, Math.min(activeRegion.end, newTime));
                    wavesurfer.setTime(clamped);
                } else {
                    wavesurfer.setTime(newTime);
                }
            });

            // Stop at region end
            wavesurfer.on('timeupdate', (currentTime) => {
                if (activeRegion && wavesurfer.isPlaying() && currentTime >= activeRegion.end) {
                    wavesurfer.pause();
                    wavesurfer.setTime(activeRegion.start);
                }
            });

            regions.on('region-updated', (region) => {
                activeRegion = region;
                updateTrimDisplay(region.start, region.end);
            });

            // Pause during drag
            regions.on('region-update', (region) => {
                activeRegion = region;
                updateTrimDisplay(region.start, region.end);
                if (wavesurfer.isPlaying()) wavesurfer.pause();
            });

            playBtn.onclick = (e) => {
                e.stopPropagation();
                if (!audioUrl) return;
                if (wavesurfer.isPlaying()) {
                    wavesurfer.pause();
                } else {
                    if (activeRegion) wavesurfer.setTime(activeRegion.start);
                    wavesurfer.play();
                }
            };

            wavesurfer.on('play', () => { playBtn.textContent = '⏸ Pause'; });
            wavesurfer.on('pause', () => { playBtn.textContent = '▶ Play Trim'; });
            wavesurfer.on('finish', () => { playBtn.textContent = '▶ Play Trim'; });
        }

        function updateTrimDisplay(start, end) {
            document.getElementById('trim-display').textContent =
                formatDuration(start) + ' → ' + formatDuration(end);
        }

        downloadBtn.onclick = async () => {
            const req = {
                url: urlInput.value.trim(),
                format: document.getElementById('format-select').value,
                quality: document.getElementById('quality-select').value,
                title: document.getElementById('meta-title').value,
                artist: document.getElementById('meta-artist').value,
                album: document.getElementById('meta-album').value,
                is_playlist: currentInfo.is_playlist || false // Send flag to backend
            };

            downloadBtn.disabled = true;
            progressContainer.style.display = 'block';

            try {
                const res = await fetch(`${addr}/api/download`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Bypass-Tunnel-Reminder': 'true' },
                    body: JSON.stringify(req)
                });
                const data = await res.json();
                if (res.status !== 200) throw new Error(data.detail || 'Download failed');

                pollTask(data.task_id, (taskId) => {
                    downloadBtn.disabled = false;

                    if (currentInfo.is_playlist) {
                        // Bypass preview step entirely for zip files
                        window.location.href = `${addr}/api/file/${taskId}`;
                    } else {
                        downloadBtn.style.display = 'none';
                        saveBtn.style.display = 'block';
                        initWaveform(currentInfo.duration, `${addr}/api/preview/${taskId}`);
                        saveBtn.onclick = () => handleSave(taskId);
                    }
                });
            } catch (err) {
                alert('Download failed: ' + err.message);
                downloadBtn.disabled = false;
            }
        };

        async function handleSave(previewTaskId) {
            const title = document.getElementById('meta-title').value;
            const artist = document.getElementById('meta-artist').value;
            const album = document.getElementById('meta-album').value;

            const req = {
                task_id: previewTaskId,
                title, artist, album,
                start_sec: null,
                end_sec: null
            };

            let needsTrim = false;
            if (activeRegion) {
                const duration = currentInfo.duration;
                if (activeRegion.start > 0.5 || activeRegion.end < duration - 0.5) {
                    req.start_sec = activeRegion.start;
                    req.end_sec = activeRegion.end;
                    needsTrim = true;
                }
            }

            const metadataChanged = title !== currentInfo.title || artist !== currentInfo.uploader || album !== '';

            if (!needsTrim && !metadataChanged) {
                window.location.href = `${addr}/api/file/${previewTaskId}`;
                return;
            }

            saveBtn.disabled = true;
            progressContainer.style.display = 'block';
            document.getElementById('status-text').textContent = 'PROCESSING...';
            
            try {
                const res = await fetch(`${addr}/api/trim`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Bypass-Tunnel-Reminder': 'true' },
                    body: JSON.stringify(req)
                });
                const data = await res.json();
                if (res.status !== 200) throw new Error(data.detail || 'Processing failed');
                
                pollTask(data.task_id, (finalTaskId) => {
                    saveBtn.disabled = false;
                    window.location.href = `${addr}/api/file/${finalTaskId}`;
                });
            } catch (err) {
                alert('Save failed: ' + err.message);
                saveBtn.disabled = false;
            }
        }

        async function pollTask(taskId, onDone) {
            const statusText = document.getElementById('status-text');
            const progressFill = document.getElementById('progress-fill');
            const speedText = document.getElementById('speed-text');
            const etaText = document.getElementById('eta-text');

            const stripAnsi = (str) => {
                if (!str) return '';
                return str.replace(/\x1B\[[0-9;]*m/g, '').replace(/\u001b\[[0-9;]*m/g, '');
            };

            const interval = setInterval(async () => {
                try {
                    const res = await fetch(`${addr}/api/task/${taskId}`, {
                        headers: { 'Bypass-Tunnel-Reminder': 'true' }
                    });
                    const task = await res.json();

                    statusText.textContent = task.status.toUpperCase();
                    progressFill.style.width = task.progress + '%';
                    speedText.textContent = task.speed !== 'N/A' ? `Speed: ${stripAnsi(task.speed)}` : '';
                    etaText.textContent = task.eta !== 'N/A' ? `ETA: ${stripAnsi(task.eta)}` : '';

                    if (task.status === 'done') {
                        clearInterval(interval);
                        onDone(taskId);
                    } else if (task.status === 'error') {
                        clearInterval(interval);
                        alert('Error: ' + task.error);
                        downloadBtn.disabled = false;
                        saveBtn.disabled = false;
                    }
                } catch (err) {
                    clearInterval(interval);
                    downloadBtn.disabled = false;
                    saveBtn.disabled = false;
                }
            }, 1000);
        }

        // --- Tabs ---
        const tabSingle = document.getElementById('tab-single');
        const tabBatch = document.getElementById('tab-batch');
        const singleView = document.getElementById('single-view');
        const batchView = document.getElementById('batch-view');

        tabSingle.onclick = () => {
            tabSingle.classList.add('active');
            tabBatch.classList.remove('active');
            singleView.classList.remove('hidden');
            batchView.classList.add('hidden');
        };

        tabBatch.onclick = () => {
            tabBatch.classList.add('active');
            tabSingle.classList.remove('active');
            batchView.classList.remove('hidden');
            singleView.classList.add('hidden');
        };

        // --- Batch Mode Logic ---
        const batchStartBtn = document.getElementById('batch-start-btn');
        const batchUrlsInput = document.getElementById('batch-urls');
        const batchFormatSelect = document.getElementById('batch-format-select');
        const batchQualitySelect = document.getElementById('batch-quality-select');
        const batchResults = document.getElementById('batch-results');
        let batchPollInterval = null;

        batchStartBtn.onclick = async () => {
            const lines = batchUrlsInput.value.split('\n').map(l => l.trim()).filter(l => l);
            if (lines.length === 0) return;

            batchStartBtn.disabled = true;
            batchStartBtn.textContent = 'Starting...';
            batchResults.innerHTML = '';

            try {
                const res = await fetch(`${addr}/api/batch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Bypass-Tunnel-Reminder': 'true' },
                    body: JSON.stringify({
                        urls: lines,
                        format_id: batchFormatSelect.value,
                        quality: batchQualitySelect.value
                    })
                });
                const data = await res.json();
                if (res.status !== 200) throw new Error(data.detail || 'Batch failed');

                const batchId = data.batch_id;
                
                data.task_ids.forEach(taskId => {
                    batchResults.innerHTML += `
                        <div class="batch-card" id="card-${taskId}">
                            <div class="batch-card-header">
                                <span class="batch-card-title">Fetching...</span>
                                <span class="batch-card-status">PENDING</span>
                            </div>
                            <div class="progress-bar" style="margin: 5px 0;"><div class="progress-fill" style="width: 0%; height: 100%; background: var(--secondary); transition: width 0.3s;"></div></div>
                            <div class="card-action"></div>
                        </div>
                    `;
                });

                batchStartBtn.textContent = 'Batch Started';

                if (batchPollInterval) clearInterval(batchPollInterval);
                batchPollInterval = setInterval(() => pollBatch(batchId), 1500);

            } catch (err) {
                alert('Batch start error: ' + err.message);
                batchStartBtn.disabled = false;
                batchStartBtn.textContent = 'Start Batch Download';
            }
        };

        async function pollBatch(batchId) {
            try {
                const res = await fetch(`${addr}/api/batch/${batchId}`, {headers: {'Bypass-Tunnel-Reminder': 'true'}});
                const data = await res.json();
                
                let allDone = true;

                data.tasks.forEach(task => {
                    const card = document.getElementById(`card-${task.task_id}`);
                    if (!card) return;

                    const titleEl = card.querySelector('.batch-card-title');
                    const statusEl = card.querySelector('.batch-card-status');
                    const fillEl = card.querySelector('.progress-fill');
                    const actionEl = card.querySelector('.card-action');

                    titleEl.textContent = task.title || 'Fetching...';
                    statusEl.textContent = task.status.toUpperCase();
                    fillEl.style.width = (task.progress || 0) + '%';

                    if (task.status === 'done') {
                        fillEl.style.width = '100%';
                        if (!actionEl.querySelector('a')) {
                            actionEl.innerHTML = `<a href="${addr}/api/file/${task.task_id}" class="batch-download-btn" download>⬇ Download</a>`;
                        }
                    } else if (task.status === 'error') {
                        statusEl.style.color = 'var(--error)';
                        actionEl.innerHTML = `<p class="batch-card-error">Error: ${task.error}</p>`;
                    } else {
                        allDone = false;
                    }
                });

                if (allDone) {
                    clearInterval(batchPollInterval);
                    batchStartBtn.disabled = false;
                    batchStartBtn.textContent = 'Start Batch Download';
                }
            } catch (err) {
                console.error('Poll error', err);
                clearInterval(batchPollInterval);
                batchStartBtn.disabled = false;
                batchStartBtn.textContent = 'Start Batch Download';
            }
        }
    </script>
</body>
</html>
